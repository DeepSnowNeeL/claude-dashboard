<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title data-i18n="common.appTitle">Claude Dashboard</title>
<!-- Shown by the service worker (sw.js) instead of the page when the PC cannot be reached: standalone, everything
     it uses is in the service worker's cache -->
<style>
  :root { --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --line: #d4d4d8; --accent: #f59e0b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1115; --card: #181b22; --text: #e6e6e9; --muted: #9a9aa5; --line: #2c313c; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0f1115; --card: #181b22; --text: #e6e6e9; --muted: #9a9aa5; --line: #2c313c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px 22px; text-align: center; }
  .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  button { width: 100%; min-height: 46px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: #18181b; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button[disabled] { opacity: .6; cursor: default; }
  .circle { width: 16px; height: 16px; border: 2px solid #18181b55; border-top-color: #18181b; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { margin-top: 12px; min-height: 1.5em; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="card">
  <div class="icon">🖥️</div>
  <h1 data-i18n="common.offline.title">The computer cannot be reached</h1>
  <p data-i18n="common.offline.text">It is probably turned off or asleep, or the dashboard is not running on it.</p>
  <button id="retry"><span class="circle" id="spinner" hidden></span><span id="label" data-i18n="common.offline.retry">Try again</span></button>
  <div class="status" id="status"></div>
</div>
<script type="module">
  // No /api/language here (the PC is off): the device's language, the dictionaries come from the service worker's cache
  import { t, setLanguage, resolveLanguage, translateDom, language, locale } from '/i18n/index.js';
  setLanguage(resolveLanguage('auto', navigator.language));
  document.documentElement.lang = language();
  translateDom(document);

  const $ = s => document.querySelector(s);
  // Retried by itself every AUTO ms while the page is visible, and when the phone gets its network back
  const AUTO = 15000;
  let trying = false, timer = null;
  async function retry() {
    if (trying) return;
    trying = true;
    clearTimeout(timer);
    $('#retry').disabled = true;
    $('#spinner').hidden = false;
    $('#label').textContent = t('common.offline.trying');
    const abort = new AbortController();
    const late = setTimeout(() => abort.abort(), 10000);
    const res = await fetch(location.href, { cache: 'no-store', signal: abort.signal }).catch(() => null);
    clearTimeout(late);
    // Reachable again: the page reloads (the service worker then lets it through)
    if (res && ![502, 503, 504].includes(res.status)) return location.reload();
    trying = false;
    $('#retry').disabled = false;
    $('#spinner').hidden = true;
    $('#label').textContent = t('common.offline.retry');
    $('#status').textContent = t('common.offline.still', { time: new Date().toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    if (document.visibilityState === 'visible') timer = setTimeout(retry, AUTO);
  }
  $('#retry').addEventListener('click', retry);
  addEventListener('online', retry);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' ? retry() : clearTimeout(timer));
  schedule();
</script>
</body>
</html>
